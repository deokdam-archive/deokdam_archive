<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>deokdam archive</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      background: #f4f5f7;
      color: #1f2328;
      margin: 0;
      padding: 32px 16px;
    }
    .container { max-width: 820px; margin: 0 auto; }
    header { margin-bottom: 20px; }
    h1 { margin: 0; font-size: 26px; }

    .card {
      background: #fff;
      border: 1px solid #d8dee4;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 12px;
    }
    .text {
      white-space: pre-line;
      line-height: 1.65;
      margin: 0 0 14px;
      font-size: 15px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .gallery img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #eaeef2;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>deokdam archive</h1>
    </header>
    <div id="list">불러오는 중...</div>
  </div>

  <script>
    fetch("archive.json")
      .then((res) => res.json())
      .then((data) => {
        const list = document.getElementById("list");
        if (!data.length) {
          list.innerHTML = "<p>등록된 항목이 없습니다.</p>";
          return;
        }

        list.innerHTML = data
          .map(
            (item) => `
            <article class="card">
              ${item.title ? `<h2 class="title">${item.title}</h2>` : ""}
              ${item.text ? `<p class="text">${item.text}</p>` : ""}
              ${
                item.images && item.images.length
                  ? `<div class="gallery">${item.images
                      .map((src) => `<img src="${src}" loading="lazy" alt="${item.title || "백업 이미지"}" />`)
                      .join("")}</div>`
                  : ""
              }
            </article>
          `
          )
          .join("");
      })
      .catch(() => {
        document.getElementById("list").innerHTML =
          "<p>archive.json 파일을 확인해 주세요.</p>";
      });
  </script>
</body>
</html>
