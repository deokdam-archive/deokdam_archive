<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>deokdam archive</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      background: #f4f5f7;
      color: #1f2328;
      margin: 0;
      padding: 32px 16px;
    }
    .container { max-width: 820px; margin: 0 auto; }
    header { margin-bottom: 20px; }
    h1 { margin: 0; font-size: 26px; }

    .lock-box {
      background: #fff;
      border: 1px solid #d8dee4;
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      margin: 40px auto;
    }
    .lock-box p { margin: 0 0 12px; font-size: 15px; }
    .lock-row { display: flex; gap: 8px; }
    .lock-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      font-size: 15px;
    }
    .lock-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #1f2328;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .error-msg {
      color: #cf222e;
      font-size: 13px;
      margin-top: 8px;
      min-height: 18px;
    }

    .card {
      background: #fff;
      border: 1px solid #d8dee4;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 12px;
    }
    .text {
      white-space: pre-line;
      line-height: 1.65;
      margin: 0 0 14px;
      font-size: 15px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .gallery img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #eaeef2;
      display: block;
    }
  </style>
</head>

      <button id="pwBtn" class="lock-btn" type="button">확인</button>
    </div>
    <div id="errMsg" class="error-msg"></div>
  </div>

  <div id="archiveView" class="container" style="display: none;">
    <header>
      <h1>deokdam archive</h1>
    </header>
    <div id="list">불러오는 중...</div>
  </div>
