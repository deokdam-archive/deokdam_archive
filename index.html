<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>deokdam archive</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      background: #f4f5f7;
      color: #1f2328;
      margin: 0;
      padding: 32px 16px;
    }
    .box, .wrap {
      max-width: 820px;
      margin: 0 auto;
    }
    .box {
      max-width: 380px;
      margin-top: 50px;
      background: #fff;
      border: 1px solid #d8dee4;
      border-radius: 12px;
      padding: 20px;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #1f2328;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    #err {
      color: #cf222e;
      font-size: 13px;
      margin-top: 8px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 26px;
    }
    .card {
      background: #fff;
      border: 1px solid #d8dee4;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .card img {
      width: 100%;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>
  <div id="lock" class="box">
    <div><strong>deokdam archive</strong> 비밀번호</div>
    <div class="row">
      <input id="pw" type="password" placeholder="비밀번호 입력" />
      <button id="btn" type="button">확인</button>
    </div>
    <div id="err"></div>
  </div>

  <div id="view" class="wrap" style="display:none;">
    <h1>deokdam archive</h1>
    <div id="list"></div>
  </div>

  <script>
    const PW = "0225";
    document.getElementById("btn").onclick = function () {
      const val = document.getElementById("pw").value.trim();
      if (val === PW) {
        document.getElementById("lock").style.display = "none";
        document.getElementById("view").style.display = "block";
        fetch("archive.json")
          .then(function (r) { return r.json(); })
          .then(function (items) {
            document.getElementById("list").innerHTML = items.map(function (item) {
              const imgs = (item.images || []).map(function (src) {
                return '<img src="' + src + '" alt="" />';
              }).join("");
              return '<div class="card">' + imgs + '</div>';
            }).join("");
          });
      } else {
        document.getElementById("err").textContent = "비밀번호가 일치하지 않습니다.";
      }
    };
  </script>
</body>
</html>
