<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive Backup</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      background: #f4f5f7;
      color: #1f2328;
      margin: 0;
      padding: 32px 16px;
    }
    .container { max-width: 820px; margin: 0 auto; }
    header { margin-bottom: 24px; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    .subtitle { color: #59636e; margin: 0; font-size: 14px; }
    .card {
      background: #fff;
      border: 1px solid #d8dee4;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .meta { font-size: 13px; color: #59636e; margin-bottom: 8px; }
    .title { font-size: 18px; font-weight: 700; margin: 0 0 12px; }
    .card img {
      width: 100%;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Archive Backup</h1>
      <p class="subtitle">사진 백업 아카이브</p>
    </header>
    <div id="list"></div>
  </div>

  <script>
    const items = [
      {
        date: "2026-11-24",
        title: "첫 번째 백업 사진",
        image: "sample1.jpg"
      }
    ];

    document.getElementById("list").innerHTML = items
      .map(
        (item) => `
        <article class="card">
          <div class="meta">${item.date}</div>
          <h2 class="title">${item.title}</h2>
          <img src="${item.image}" alt="${item.title}" />
        </article>
      `
      )
      .join("");
  </script>
</body>
</html>
