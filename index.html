<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>deokdam archive</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      background: #f4f5f7;
      color: #1f2328;
      margin: 0;
      padding: 32px 16px;
    }
    .wrap {
      max-width: 820px;
      margin: 0 auto;
    }
    .box {
      max-width: 380px;
      margin: 50px auto 0;
      background: #fff;
      border: 1px solid #d8dee4;
      border-radius: 12px;
      padding: 20px;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      flex-shrink: 0;
      white-space: nowrap;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #1f2328;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    #err {
      color: #cf222e;
      font-size: 13px;
      margin-top: 8px;
      min-height: 18px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 26px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: #fff;
      color: #1f2328;
      border: 1px solid #d0d7de;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
    }
    .tab-btn.active {
      background: #1f2328;
      color: #fff;
      border-color: #1f2328;
    }

    .card {
      background: #fff;
      border: 1px solid #d8dee4;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 10px;
    }
    .card img {
      width: 100%;
      border-radius: 8px;
      display: block;
      margin-bottom: 12px;
    }
    .text {
      white-space: pre-line;
      line-height: 1.65;
      margin: 12px 0 0;
      font-size: 15px;
    }
    .card img:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div id="lock" class="box">
    <div><strong>deokdam archive</strong> 비밀번호를 입력하세요.</div>
    <div class="row">
      <input id="pw" type="password" placeholder="비밀번호" />
      <button id="btn" type="button">확인</button>
    </div>
    <div id="err"></div>
  </div>

  <div id="view" class="wrap" style="display: none;">
    <h1>deokdam archive</h1>
    <div class="tabs">
      <button id="tabMembership" class="tab-btn active" type="button">멤버십</button>
      <button id="tabLetter" class="tab-btn" type="button">편지</button>
      <button id="tabDiscord" class="tab-btn" type="button">디스코드</button>
    </div>
    <div id="list"></div>
  </div>

  <script>
    const btn = document.getElementById("btn");
    const pw = document.getElementById("pw");
    const err = document.getElementById("err");
    const tabMembership = document.getElementById("tabMembership");
    const tabLetter = document.getElementById("tabLetter");
    const tabDiscord = document.getElementById("tabDiscord");

    const tabNames = {
      membership: "멤버십",
      letter: "편지",
      discord: "디스코드"
    };

    let allItems = [];
    let currentTab = "membership";

    function renderTab() {
      const list = document.getElementById("list");
      const filtered = allItems.filter((item) => {
        const cat = item.category || "membership";
        return cat === currentTab;
      });

      if (!filtered.length) {
        list.innerHTML = `<p>${tabNames[currentTab]} 항목이 없습니다.</p>`;
        return;
      }

      list.innerHTML = filtered
        .map((item) => {
          const titleHtml = item.title ? `<h2 class="title">${item.title}</h2>` : "";
          const imgsHtml = (item.images || [])
            .map((src) => `<img src="${src}" alt="${item.title || ""}" />`)
            .join("");
          const textHtml = item.text ? `<p class="text">${item.text}</p>` : "";
          return `<div class="card">${titleHtml}${imgsHtml}${textHtml}</div>`;
        })
        .join("");
    }

    function setTab(tabName) {
      currentTab = tabName;
      tabMembership.classList.toggle("active", tabName === "membership");
      tabLetter.classList.toggle("active", tabName === "letter");
      tabDiscord.classList.toggle("active", tabName === "discord");
      renderTab();
    }

    tabMembership.addEventListener("click", () => setTab("membership"));
    tabLetter.addEventListener("click", () => setTab("letter"));
    tabDiscord.addEventListener("click", () => setTab("discord"));

    function checkPw() {
      if (pw.value.trim() === "0225") {
        err.textContent = "";
        document.getElementById("lock").style.display = "none";
        document.getElementById("view").style.display = "block";
        fetch("archive.json")
          .then((res) => res.json())
          .then((items) => {
            allItems = items;
            renderTab();
          })
          .catch(() => {
            document.getElementById("list").innerHTML =
              "<p>archive.json 파일을 확인해 주세요.</p>";
          });
      } else {
        err.textContent = "비밀번호가 일치하지 않습니다.";
      }
    }

    btn.addEventListener("click", checkPw);
    pw.addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkPw();
    });
  </script>
</body>
</html>
